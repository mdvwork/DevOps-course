name: Student CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python version
        run: python --version
      - name: Run tests
        run: python -m unittest discover -s tests -p test_app.py -v

  build:
      runs-on: ubuntu-latest
      needs: test
      steps:
        - name: Checkout
          uses: actions/checkout@v5
        - name: Build Docker image
          run: docker build -f Dockerfile -t devops-student:${{ github.sha }} .